<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1234" viewBox="0 0 360 1234" role="img" aria-labelledby="title desc">
<title id="title">Blue-green: до и после переключения</title><desc id="desc">Трафик переходит с blue на green после проверок. Возврат на blue возможен только при совместимости. Данные, платежи и уведомления требуют отдельного плана.</desc>
<style>
svg{font-family:Inter,Arial,sans-serif;background:#f6f5f2}
.bg{fill:#f6f5f2} .ink{fill:#18212c} .muted{fill:#536171}
.card{fill:#fff;stroke:#cbd2da;stroke-width:1.5}
.flow{stroke:#637185} .amber{fill:#8c5100} .stop{fill:#fff1db;stroke:#bb781c}
.blue{fill:#edf4ff;stroke:#3571bc;stroke-width:2} .green{fill:#eaf6ee;stroke:#28744d;stroke-width:2}
.blue-text{fill:#225ba0} .green-text{fill:#216440}
@media(prefers-color-scheme:dark){svg{background:#151923} .bg{fill:#151923} .ink{fill:#f4f2ed} .muted{fill:#bcc6d5} .card{fill:#202634;stroke:#4c576b} .flow{stroke:#a5b1c4} .amber{fill:#ffb048} .stop{fill:#30291e;stroke:#c98c37} .blue{fill:#1b2a43;stroke:#81b6ff} .green{fill:#19372a;stroke:#70d69d} .blue-text{fill:#a7ceff} .green-text{fill:#93e8b7}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" class="muted"/></marker></defs>
<rect width="360" height="1234" rx="20" class="bg"/><text x="24" y="36" class="amber" font-size="14" font-weight="700">02 / BLUE–GREEN</text><rect x="24" y="65" width="312" height="390" rx="16" class="card"/><text x="44" y="97" class="muted" font-size="15" font-weight="700">ДО ПЕРЕКЛЮЧЕНИЯ</text><text x="44" y="138" class="ink" font-size="22" font-weight="600">Пользователи</text><path d="M180.0 150 V175" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="44" y="185" width="272" height="52" rx="16" class="card"/><text x="62" y="218" class="ink" font-size="20" font-weight="600">Маршрутизатор</text><path d="M180.0 237 V262" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="44" y="271" width="272" height="78" rx="16" class="blue"/><text x="62" y="301" class="blue-text" font-size="18" font-weight="700">BLUE · текущая версия</text><text x="62" y="328" class="ink" font-size="13" font-weight="700">ОБСЛУЖИВАЕТ ТРАФИК</text><rect x="44" y="365" width="272" height="70" rx="16" class="green"/><text x="62" y="392" class="green-text" font-size="18" font-weight="700">GREEN · новая версия</text><text x="62" y="417" class="muted" font-size="15" font-weight="500">На проверке · без трафика</text><rect x="24" y="490" width="312" height="390" rx="16" class="card"/><text x="44" y="522" class="muted" font-size="15" font-weight="700">ПОСЛЕ ПЕРЕКЛЮЧЕНИЯ</text><text x="44" y="563" class="ink" font-size="22" font-weight="600">Пользователи</text><path d="M180.0 575 V600" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="44" y="610" width="272" height="52" rx="16" class="card"/><text x="62" y="643" class="ink" font-size="20" font-weight="600">Маршрутизатор</text><path d="M180.0 662 V687" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="44" y="696" width="272" height="78" rx="16" class="green"/><text x="62" y="726" class="green-text" font-size="18" font-weight="700">GREEN · новая версия</text><text x="62" y="753" class="ink" font-size="13" font-weight="700">ОБСЛУЖИВАЕТ ТРАФИК</text><rect x="44" y="790" width="272" height="70" rx="16" class="blue"/><text x="62" y="817" class="blue-text" font-size="18" font-weight="700">BLUE · прежняя версия</text><text x="62" y="842" class="muted" font-size="15" font-weight="500">Сохранена для возврата</text><path d="M180 460 V484" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M310 924 H50" class="flow" fill="none" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="24" y="958" class="ink" font-size="18" font-weight="600">Возврат трафика на BLUE:</text><text x="24" y="984" class="ink" font-size="18" font-weight="600">только при сохранённой</text><text x="24" y="1010" class="ink" font-size="18" font-weight="600">совместимости.</text><rect x="24" y="1044" width="312" height="166" rx="16" class="stop"/><text x="42" y="1074" class="amber" font-size="12" font-weight="700">НЕ ОТКАТЫВАЕТ АВТОМАТИЧЕСКИ</text><text x="42" y="1107" class="ink" font-size="17" font-weight="500">Изменения данных</text><text x="42" y="1132" class="ink" font-size="17" font-weight="500">Платежи</text><text x="42" y="1157" class="ink" font-size="17" font-weight="500">Отправленные уведомления</text></svg>