<svg xmlns="http://www.w3.org/2000/svg" width="920" height="706" viewBox="0 0 920 706" role="img" aria-labelledby="title desc">
<title id="title">Blue-green: до и после переключения</title><desc id="desc">Слева трафик обслуживает blue, green на проверке. Справа трафик обслуживает green, blue сохранена. Пунктирный возврат допустим только при совместимости. Изменения данных и внешние действия не отменяются автоматически.</desc>
<style>
svg{font-family:Inter,Arial,sans-serif;background:#f6f5f2}
.bg{fill:#f6f5f2} .ink{fill:#18212c} .muted{fill:#536171}
.card{fill:#fff;stroke:#cbd2da;stroke-width:1.5}
.flow{stroke:#637185} .amber{fill:#8c5100} .stop{fill:#fff1db;stroke:#bb781c}
.blue{fill:#edf4ff;stroke:#3571bc;stroke-width:2} .green{fill:#eaf6ee;stroke:#28744d;stroke-width:2}
.blue-text{fill:#225ba0} .green-text{fill:#216440}
@media(prefers-color-scheme:dark){svg{background:#151923} .bg{fill:#151923} .ink{fill:#f4f2ed} .muted{fill:#bcc6d5} .card{fill:#202634;stroke:#4c576b} .flow{stroke:#a5b1c4} .amber{fill:#ffb048} .stop{fill:#30291e;stroke:#c98c37} .blue{fill:#1b2a43;stroke:#81b6ff} .green{fill:#19372a;stroke:#70d69d} .blue-text{fill:#a7ceff} .green-text{fill:#93e8b7}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" class="muted"/></marker></defs>
<rect width="920" height="706" rx="20" class="bg"/><text x="32" y="36" class="amber" font-size="14" font-weight="700">02 / BLUE–GREEN</text><rect x="32" y="72" width="408" height="390" rx="16" class="card"/><text x="52" y="104" class="muted" font-size="15" font-weight="700">ДО ПЕРЕКЛЮЧЕНИЯ</text><text x="52" y="145" class="ink" font-size="22" font-weight="600">Пользователи</text><path d="M236.0 157 V182" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="52" y="192" width="368" height="52" rx="16" class="card"/><text x="70" y="225" class="ink" font-size="20" font-weight="600">Маршрутизатор</text><path d="M236.0 244 V269" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="52" y="278" width="368" height="78" rx="16" class="blue"/><text x="70" y="308" class="blue-text" font-size="18" font-weight="700">BLUE · текущая версия</text><text x="70" y="335" class="ink" font-size="13" font-weight="700">ОБСЛУЖИВАЕТ ТРАФИК</text><rect x="52" y="372" width="368" height="70" rx="16" class="green"/><text x="70" y="399" class="green-text" font-size="18" font-weight="700">GREEN · новая версия</text><text x="70" y="424" class="muted" font-size="15" font-weight="500">На проверке · без трафика</text><rect x="480" y="72" width="408" height="390" rx="16" class="card"/><text x="500" y="104" class="muted" font-size="15" font-weight="700">ПОСЛЕ ПЕРЕКЛЮЧЕНИЯ</text><text x="500" y="145" class="ink" font-size="22" font-weight="600">Пользователи</text><path d="M684.0 157 V182" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="500" y="192" width="368" height="52" rx="16" class="card"/><text x="518" y="225" class="ink" font-size="20" font-weight="600">Маршрутизатор</text><path d="M684.0 244 V269" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="500" y="278" width="368" height="78" rx="16" class="green"/><text x="518" y="308" class="green-text" font-size="18" font-weight="700">GREEN · новая версия</text><text x="518" y="335" class="ink" font-size="13" font-weight="700">ОБСЛУЖИВАЕТ ТРАФИК</text><rect x="500" y="372" width="368" height="70" rx="16" class="blue"/><text x="518" y="399" class="blue-text" font-size="18" font-weight="700">BLUE · прежняя версия</text><text x="518" y="424" class="muted" font-size="15" font-weight="500">Сохранена для возврата</text><path d="M442 268 H472" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M684 472 V503 H236 V472" class="flow" fill="none" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="204" y="539" class="ink" font-size="18" font-weight="600">Возврат на BLUE — только при сохранённой совместимости</text><rect x="32" y="572" width="856" height="102" rx="16" class="stop"/><text x="54" y="604" class="ink" font-size="23" font-weight="600">Возврат трафика ≠ возврат состояния системы</text><text x="54" y="642" class="muted" font-size="18" font-weight="500">Данные, платежи и уведомления требуют отдельного плана восстановления.</text></svg>