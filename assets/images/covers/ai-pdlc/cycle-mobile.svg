<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1368" viewBox="0 0 360 1368" role="img" aria-labelledby="title desc">
<title id="title">AI PDLC: этапы и решения о возврате</title><desc id="desc">Шесть этапов с проверкой. Неподтверждённая проблема — остановка, непонятный прототип — возврат к решению, отсутствие пользы — пересмотр гипотезы.</desc>
<style>
svg{font-family:Inter,Arial,sans-serif;background:#f6f5f2}
.bg{fill:#f6f5f2} .ink{fill:#18212c} .muted{fill:#536171}
.card{fill:#fff;stroke:#cbd2da;stroke-width:1.5}
.flow{stroke:#637185} .amber{fill:#8c5100} .stop{fill:#fff1db;stroke:#bb781c}
.blue{fill:#edf4ff;stroke:#3571bc;stroke-width:2} .green{fill:#eaf6ee;stroke:#28744d;stroke-width:2}
.blue-text{fill:#225ba0} .green-text{fill:#216440}
@media(prefers-color-scheme:dark){svg{background:#151923} .bg{fill:#151923} .ink{fill:#f4f2ed} .muted{fill:#bcc6d5} .card{fill:#202634;stroke:#4c576b} .flow{stroke:#a5b1c4} .amber{fill:#ffb048} .stop{fill:#30291e;stroke:#c98c37} .blue{fill:#1b2a43;stroke:#81b6ff} .green{fill:#19372a;stroke:#70d69d} .blue-text{fill:#a7ceff} .green-text{fill:#93e8b7}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" class="muted"/></marker></defs>
<rect width="360" height="1368" rx="20" class="bg"/><text x="24" y="34" class="amber" font-size="14" font-weight="700">01 / ЦИКЛ ПРОДУКТА</text><rect x="24" y="60" width="312" height="132" rx="16" class="card"/><text x="42" y="87" class="amber" font-size="14" font-weight="700">01</text><text x="42" y="116" class="ink" font-size="22" font-weight="600">Проблема</text><text x="42" y="174" class="muted" font-size="16" font-weight="500">Есть свидетельства?</text><path d="M180 193 V221" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="24" y="228" width="312" height="132" rx="16" class="card"/><text x="42" y="255" class="amber" font-size="14" font-weight="700">02</text><text x="42" y="284" class="ink" font-size="22" font-weight="600">Гипотеза</text><text x="42" y="342" class="muted" font-size="16" font-weight="500">Что проверяем?</text><path d="M180 361 V389" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="24" y="396" width="312" height="132" rx="16" class="card"/><text x="42" y="423" class="amber" font-size="14" font-weight="700">03</text><text x="42" y="452" class="ink" font-size="22" font-weight="600">Требования</text><text x="42" y="482" class="ink" font-size="22" font-weight="600">и прототип</text><text x="42" y="510" class="muted" font-size="16" font-weight="500">Понятен сценарий?</text><path d="M180 529 V557" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="24" y="564" width="312" height="132" rx="16" class="card"/><text x="42" y="591" class="amber" font-size="14" font-weight="700">04</text><text x="42" y="620" class="ink" font-size="22" font-weight="600">Реализация</text><text x="42" y="678" class="muted" font-size="16" font-weight="500">Решение проверено?</text><path d="M180 697 V725" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="24" y="732" width="312" height="132" rx="16" class="card"/><text x="42" y="759" class="amber" font-size="14" font-weight="700">05</text><text x="42" y="788" class="ink" font-size="22" font-weight="600">Выпуск</text><text x="42" y="846" class="muted" font-size="16" font-weight="500">Готов возврат?</text><path d="M180 865 V893" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><rect x="24" y="900" width="312" height="132" rx="16" class="card"/><text x="42" y="927" class="amber" font-size="14" font-weight="700">06</text><text x="42" y="956" class="ink" font-size="22" font-weight="600">Проверка</text><text x="42" y="986" class="ink" font-size="22" font-weight="600">эффекта</text><text x="42" y="1014" class="muted" font-size="16" font-weight="500">Есть польза?</text><rect x="24" y="1090" width="312" height="108" rx="16" class="stop"/><text x="42" y="1120" class="ink" font-size="17" font-weight="600">Проблема не подтверждена</text><text x="42" y="1149" class="muted" font-size="15" font-weight="500">Стоп: не начинаем разработку.</text><text x="42" y="1172" class="muted" font-size="15" font-weight="500">При необходимости — исследуем.</text><text x="24" y="1234" class="ink" font-size="16" font-weight="500">↶ Прототип выявил непонимание:</text><text x="24" y="1258" class="ink" font-size="16" font-weight="500">возвращаемся к решению.</text><text x="24" y="1300" class="ink" font-size="16" font-weight="500">↶ Нет пользы после выпуска:</text><text x="24" y="1324" class="ink" font-size="16" font-weight="500">пересматриваем гипотезу.</text></svg>