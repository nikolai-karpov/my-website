<svg xmlns="http://www.w3.org/2000/svg" width="920" height="710" viewBox="0 0 920 710" role="img" aria-labelledby="title desc">
<title id="title">AI PDLC: цикл с проверками и возвратами</title><desc id="desc">Проблема, гипотеза, требования и прототип, реализация, выпуск, проверка эффекта. Пунктир — возвраты. При неподтверждённой проблеме разработку не начинаем.</desc>
<style>
svg{font-family:Inter,Arial,sans-serif;background:#f6f5f2}
.bg{fill:#f6f5f2} .ink{fill:#18212c} .muted{fill:#536171}
.card{fill:#fff;stroke:#cbd2da;stroke-width:1.5}
.flow{stroke:#637185} .amber{fill:#8c5100} .stop{fill:#fff1db;stroke:#bb781c}
.blue{fill:#edf4ff;stroke:#3571bc;stroke-width:2} .green{fill:#eaf6ee;stroke:#28744d;stroke-width:2}
.blue-text{fill:#225ba0} .green-text{fill:#216440}
@media(prefers-color-scheme:dark){svg{background:#151923} .bg{fill:#151923} .ink{fill:#f4f2ed} .muted{fill:#bcc6d5} .card{fill:#202634;stroke:#4c576b} .flow{stroke:#a5b1c4} .amber{fill:#ffb048} .stop{fill:#30291e;stroke:#c98c37} .blue{fill:#1b2a43;stroke:#81b6ff} .green{fill:#19372a;stroke:#70d69d} .blue-text{fill:#a7ceff} .green-text{fill:#93e8b7}}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" class="muted"/></marker></defs>
<rect width="920" height="710" rx="20" class="bg"/><text x="32" y="40" class="amber" font-size="15" font-weight="700">01 / ЦИКЛ ПРОДУКТА</text><text x="32" y="78" class="ink" font-size="26" font-weight="600">Проверяем результат — затем идём дальше</text><rect x="32" y="116" width="256" height="160" rx="16" class="card"/><text x="52" y="145" class="amber" font-size="14" font-weight="700">01</text><text x="52" y="182" class="ink" font-size="25" font-weight="600">Проблема</text><text x="52" y="253" class="muted" font-size="17" font-weight="500">Есть свидетельства?</text><rect x="332" y="116" width="256" height="160" rx="16" class="card"/><text x="352" y="145" class="amber" font-size="14" font-weight="700">02</text><text x="352" y="182" class="ink" font-size="25" font-weight="600">Гипотеза</text><text x="352" y="253" class="muted" font-size="17" font-weight="500">Что проверяем?</text><rect x="632" y="116" width="256" height="160" rx="16" class="card"/><text x="652" y="145" class="amber" font-size="14" font-weight="700">03</text><text x="652" y="182" class="ink" font-size="25" font-weight="600">Требования</text><text x="652" y="215" class="ink" font-size="25" font-weight="600">и прототип</text><text x="652" y="253" class="muted" font-size="17" font-weight="500">Понятен сценарий?</text><rect x="632" y="340" width="256" height="160" rx="16" class="card"/><text x="652" y="369" class="amber" font-size="14" font-weight="700">04</text><text x="652" y="406" class="ink" font-size="25" font-weight="600">Реализация</text><text x="652" y="477" class="muted" font-size="17" font-weight="500">Решение проверено?</text><rect x="332" y="340" width="256" height="160" rx="16" class="card"/><text x="352" y="369" class="amber" font-size="14" font-weight="700">05</text><text x="352" y="406" class="ink" font-size="25" font-weight="600">Выпуск</text><text x="352" y="477" class="muted" font-size="17" font-weight="500">Готов возврат?</text><rect x="32" y="340" width="256" height="160" rx="16" class="card"/><text x="52" y="369" class="amber" font-size="14" font-weight="700">06</text><text x="52" y="406" class="ink" font-size="25" font-weight="600">Проверка</text><text x="52" y="439" class="ink" font-size="25" font-weight="600">эффекта</text><text x="52" y="477" class="muted" font-size="17" font-weight="500">Есть польза?</text><path d="M288 196 H326" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M588 196 H626" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M760 276 V334" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M632 420 H594" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M332 420 H294" class="flow" fill="none" stroke-width="2"  marker-end="url(#arrow)"/><path d="M700 276 V300 H540 V282" class="flow" fill="none" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="550" y="326" class="muted" font-size="15" font-weight="500">Уточняем решение</text><path d="M160 340 V300 H400 V282" class="flow" fill="none" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="176" y="326" class="muted" font-size="15" font-weight="500">Нет пользы → к гипотезе</text><text x="32" y="553" class="muted" font-size="18" font-weight="500">Сплошная линия — следующий этап. Пунктир — возврат или остановка.</text><path d="M160 276 V290 H20 V580 H64 V594" class="flow" fill="none" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><rect x="32" y="600" width="856" height="82" rx="16" class="stop"/><text x="54" y="630" class="ink" font-size="21" font-weight="600">Проблема не подтверждена → разработку не начинаем</text><text x="54" y="659" class="muted" font-size="17" font-weight="500">Остановка или дополнительное исследование — не обязательный переход дальше.</text></svg>