<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Коллаборация человека и ИИ в фармацевтической отрасли">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f4d"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brainL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="brainR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fde68a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <g stroke="#93c5fd" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 70 H1600 M0 140 H1600 M0 210 H1600 M0 280 H1600 M0 350 H1600"/>
  </g>

  <!-- HUMAN side (left) -->
  <g transform="translate(420 210)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="170" fill="#fbbf24" fill-opacity="0.06"/>
    <circle cx="0" cy="0" r="130" fill="#fbbf24" fill-opacity="0.08"/>

    <!-- Head silhouette in profile (facing right) -->
    <path d="
      M -10 -110
      C 50 -110, 90 -70, 90 -10
      C 90 30, 70 60, 50 80
      L 50 110
      L -60 110
      L -60 70
      C -90 50, -100 10, -100 -20
      C -100 -80, -60 -110, -10 -110 Z"
      fill="#0f172a" stroke="#fbbf24" stroke-width="2.5"/>

    <!-- Brain (left/human) -->
    <g transform="translate(-10 -30)">
      <path d="
        M -40 0
        C -50 -30, -20 -50, 0 -40
        C 10 -55, 40 -50, 50 -30
        C 70 -25, 70 5, 55 15
        C 60 35, 30 45, 10 35
        C -5 45, -30 35, -35 20
        C -50 15, -55 -5, -40 0 Z"
        fill="url(#brainL)" opacity="0.95"/>
      <!-- Brain folds -->
      <g stroke="#7c2d12" stroke-width="1.5" stroke-opacity="0.45" fill="none">
        <path d="M-30 -10 C -20 -20, -10 -15, 0 -25"/>
        <path d="M0 -20 C 10 -30, 30 -25, 40 -10"/>
        <path d="M-25 5 C -10 0, 10 5, 25 0"/>
        <path d="M-15 18 C 0 14, 20 20, 35 12"/>
      </g>
    </g>
  </g>

  <!-- AI side (right) - robot head -->
  <g transform="translate(1180 210)">
    <circle cx="0" cy="0" r="170" fill="#22d3ee" fill-opacity="0.06"/>
    <circle cx="0" cy="0" r="130" fill="#22d3ee" fill-opacity="0.08"/>

    <!-- Robot head silhouette (facing left, mirrored) -->
    <path d="
      M 10 -110
      C -50 -110, -90 -70, -90 -10
      C -90 30, -70 60, -50 80
      L -50 110
      L 60 110
      L 60 70
      C 90 50, 100 10, 100 -20
      C 100 -80, 60 -110, 10 -110 Z"
      fill="#0f172a" stroke="#22d3ee" stroke-width="2.5"/>

    <!-- Neural network (right/AI brain) -->
    <g transform="translate(10 -30)">
      <!-- Connections -->
      <g stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.2" fill="none">
        <path d="M-40 -10 L-10 -30 L20 -10 L50 -30"/>
        <path d="M-40 10 L-10 0 L20 10 L50 0"/>
        <path d="M-40 30 L-10 20 L20 30 L50 20"/>
        <path d="M-40 -10 L-10 0 L20 -10 L50 0"/>
        <path d="M-40 10 L-10 -30 L20 10 L50 -30"/>
        <path d="M-40 30 L-10 20 L20 -10 L50 20"/>
        <path d="M-10 -30 L20 30"/>
        <path d="M-10 0 L20 -10 L50 20"/>
      </g>
      <!-- Nodes -->
      <g fill="#22d3ee" stroke="#a78bfa" stroke-width="1.5">
        <circle cx="-40" cy="-10" r="6"/>
        <circle cx="-40" cy="10" r="6"/>
        <circle cx="-40" cy="30" r="6"/>
        <circle cx="-10" cy="-30" r="7"/>
        <circle cx="-10" cy="0" r="7"/>
        <circle cx="-10" cy="20" r="7"/>
        <circle cx="20" cy="-10" r="7"/>
        <circle cx="20" cy="10" r="7"/>
        <circle cx="20" cy="30" r="7"/>
        <circle cx="50" cy="-30" r="6"/>
        <circle cx="50" cy="0" r="6"/>
        <circle cx="50" cy="20" r="6"/>
      </g>
    </g>

    <!-- Robot dots/eyes hints -->
    <circle cx="-30" cy="60" r="3" fill="#22d3ee"/>
    <circle cx="30" cy="60" r="3" fill="#22d3ee"/>
  </g>

  <!-- Central connection (synapse) -->
  <g>
    <!-- Glow -->
    <circle cx="800" cy="210" r="90" fill="url(#spark)"/>
    <!-- Data stream lines -->
    <g stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M510 200 Q 650 180, 780 205" stroke-opacity="0.85"/>
      <path d="M510 220 Q 650 240, 780 225" stroke-opacity="0.65"/>
    </g>
    <g stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M820 205 Q 950 180, 1090 200" stroke-opacity="0.85"/>
      <path d="M820 225 Q 950 240, 1090 220" stroke-opacity="0.65"/>
    </g>

    <!-- Dots along streams -->
    <g fill="#fde68a">
      <circle cx="600" cy="188" r="3"/>
      <circle cx="680" cy="195" r="3"/>
      <circle cx="730" cy="220" r="2.5"/>
      <circle cx="640" cy="225" r="2.5"/>
    </g>
    <g fill="#a5f3fc">
      <circle cx="900" cy="188" r="3"/>
      <circle cx="970" cy="195" r="3"/>
      <circle cx="1020" cy="220" r="2.5"/>
      <circle cx="930" cy="225" r="2.5"/>
    </g>

    <!-- Central node: synergy badge -->
    <g transform="translate(800 210)">
      <circle r="38" fill="#0f172a" stroke="#e0e7ff" stroke-width="2"/>
      <circle r="38" fill="none" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3,4"/>
      <!-- DNA + chip merge icon -->
      <path d="M-14 -16 C 0 -10, 14 -22, 14 -8" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M-14 -8 C 0 -22, 14 -10, 14 -16" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <rect x="-12" y="2" width="24" height="18" rx="3" fill="#1e293b" stroke="#22d3ee"/>
      <line x1="-6" y1="6" x2="6" y2="6" stroke="#22d3ee" stroke-width="1.5"/>
      <line x1="-6" y1="11" x2="6" y2="11" stroke="#a78bfa" stroke-width="1.5"/>
      <line x1="-6" y1="16" x2="6" y2="16" stroke="#fbbf24" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Labels -->
  <g font-family="ui-monospace,monospace" font-size="12" font-weight="700">
    <text x="420" y="370" text-anchor="middle" fill="#fbbf24">HUMAN EXPERTISE</text>
    <text x="800" y="298" text-anchor="middle" fill="#e0e7ff">SYNERGY</text>
    <text x="1180" y="370" text-anchor="middle" fill="#22d3ee">AI INTELLIGENCE</text>
  </g>

  <!-- Decorative challenge tags (top) -->
  <g font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">
    <g transform="translate(80 70)">
      <rect x="0" y="0" width="170" height="28" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#475569"/>
      <text x="14" y="18">⚠ data quality</text>
    </g>
    <g transform="translate(80 110)">
      <rect x="0" y="0" width="170" height="28" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#475569"/>
      <text x="14" y="18">⚠ regulation</text>
    </g>
    <g transform="translate(1350 70)">
      <rect x="0" y="0" width="180" height="28" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#475569"/>
      <text x="14" y="18" fill="#22c55e">✓ explainability</text>
    </g>
    <g transform="translate(1350 110)">
      <rect x="0" y="0" width="180" height="28" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#475569"/>
      <text x="14" y="18" fill="#22c55e">✓ governance</text>
    </g>
  </g>
</svg>
