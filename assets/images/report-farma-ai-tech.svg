<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Технологии ИИ в фармацевтике">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f4d"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nodeIn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="nodeH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="nodeOut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <g stroke="#93c5fd" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 70 H1600 M0 140 H1600 M0 210 H1600 M0 280 H1600 M0 350 H1600"/>
    <path d="M200 0 V420 M400 0 V420 M600 0 V420 M800 0 V420 M1000 0 V420 M1200 0 V420 M1400 0 V420"/>
  </g>

  <!-- Neural network layers -->
  <!-- Input layer -->
  <g>
    <g stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <!-- input → hidden1 -->
      <path d="M180 80 L460 80 M180 80 L460 160 M180 80 L460 240 M180 80 L460 320 M180 80 L460 340"/>
      <path d="M180 150 L460 80 M180 150 L460 160 M180 150 L460 240 M180 150 L460 320 M180 150 L460 340"/>
      <path d="M180 220 L460 80 M180 220 L460 160 M180 220 L460 240 M180 220 L460 320 M180 220 L460 340"/>
      <path d="M180 290 L460 80 M180 290 L460 160 M180 290 L460 240 M180 290 L460 320 M180 290 L460 340"/>
      <path d="M180 360 L460 80 M180 360 L460 160 M180 360 L460 240 M180 360 L460 320 M180 360 L460 340"/>
    </g>
    <g stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <!-- hidden1 → hidden2 -->
      <path d="M460 80 L760 90 M460 80 L760 170 M460 80 L760 250 M460 80 L760 330"/>
      <path d="M460 160 L760 90 M460 160 L760 170 M460 160 L760 250 M460 160 L760 330"/>
      <path d="M460 240 L760 90 M460 240 L760 170 M460 240 L760 250 M460 240 L760 330"/>
      <path d="M460 320 L760 90 M460 320 L760 170 M460 320 L760 250 M460 320 L760 330"/>
      <path d="M460 340 L760 90 M460 340 L760 170 M460 340 L760 250 M460 340 L760 330"/>
    </g>
    <g stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <!-- hidden2 → output -->
      <path d="M760 90 L1060 140 M760 90 L1060 220 M760 90 L1060 300"/>
      <path d="M760 170 L1060 140 M760 170 L1060 220 M760 170 L1060 300"/>
      <path d="M760 250 L1060 140 M760 250 L1060 220 M760 250 L1060 300"/>
      <path d="M760 330 L1060 140 M760 330 L1060 220 M760 330 L1060 300"/>
    </g>
  </g>

  <!-- Input nodes -->
  <g>
    <circle cx="180" cy="80" r="18" fill="url(#nodeIn)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="180" cy="150" r="18" fill="url(#nodeIn)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="180" cy="220" r="18" fill="url(#nodeIn)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="180" cy="290" r="18" fill="url(#nodeIn)" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="180" cy="360" r="18" fill="url(#nodeIn)" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <!-- Hidden 1 -->
  <g>
    <circle cx="460" cy="80" r="16" fill="url(#nodeH)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="460" cy="160" r="16" fill="url(#nodeH)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="460" cy="240" r="16" fill="url(#nodeH)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="460" cy="320" r="16" fill="url(#nodeH)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="460" cy="340" r="0"/>
  </g>
  <!-- Hidden 2 -->
  <g>
    <circle cx="760" cy="90" r="16" fill="url(#nodeH)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="760" cy="170" r="16" fill="url(#nodeH)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="760" cy="250" r="16" fill="url(#nodeH)" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="760" cy="330" r="16" fill="url(#nodeH)" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <!-- Output -->
  <g>
    <circle cx="1060" cy="140" r="20" fill="url(#nodeOut)" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="1060" cy="220" r="20" fill="url(#nodeOut)" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="1060" cy="300" r="20" fill="url(#nodeOut)" stroke="#a78bfa" stroke-width="2"/>
  </g>

  <!-- Layer labels -->
  <g font-family="ui-monospace,monospace" font-size="11" fill="#93c5fd">
    <text x="180" y="404" text-anchor="middle">INPUT</text>
    <text x="460" y="404" text-anchor="middle">HIDDEN · ReLU</text>
    <text x="760" y="404" text-anchor="middle">HIDDEN · ReLU</text>
    <text x="1060" y="404" text-anchor="middle">OUTPUT</text>
  </g>

  <!-- ML pipeline boxes (right side) -->
  <g transform="translate(1180 50)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="360" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <circle cx="32" cy="37" r="14" fill="#22d3ee"/>
    <text x="32" y="42" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="13" fill="#0f172a">ML</text>
    <text x="62" y="32" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="14" fill="#e0e7ff">Machine Learning</text>
    <text x="62" y="52" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">classification · regression · clustering</text>

    <!-- Box 2 -->
    <rect x="0" y="92" width="360" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <circle cx="32" cy="129" r="14" fill="#60a5fa"/>
    <text x="32" y="134" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="13" fill="#0f172a">DL</text>
    <text x="62" y="124" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="14" fill="#e0e7ff">Deep Learning</text>
    <text x="62" y="144" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">CNN · Transformer · GNN</text>

    <!-- Box 3 -->
    <rect x="0" y="184" width="360" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <circle cx="32" cy="221" r="14" fill="#a78bfa"/>
    <text x="32" y="226" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="11" fill="#0f172a">GEN</text>
    <text x="62" y="216" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="14" fill="#e0e7ff">Generative AI</text>
    <text x="62" y="236" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">LLM · diffusion · de-novo molecules</text>

    <!-- Box 4 -->
    <rect x="0" y="276" width="360" height="74" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <circle cx="32" cy="313" r="14" fill="#22c55e"/>
    <text x="32" y="318" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="11" fill="#0f172a">DT</text>
    <text x="62" y="308" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="14" fill="#e0e7ff">Digital Twin</text>
    <text x="62" y="328" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">simulation · what-if · process control</text>
  </g>

  <!-- Predictions tag near output -->
  <g transform="translate(1060 50)">
    <rect x="-50" y="-10" width="100" height="28" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#a78bfa"/>
    <text x="0" y="9" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="12" fill="#e0e7ff">PREDICT</text>
  </g>
</svg>
