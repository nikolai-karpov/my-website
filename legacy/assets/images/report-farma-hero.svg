<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Искусственный интеллект в фармацевтической лаборатории">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f4d"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="50.01%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="strandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="strandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Grid -->
  <g stroke="#93c5fd" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200 M0 600 H1200 M0 700 H1200"/>
    <path d="M100 0 V800 M200 0 V800 M300 0 V800 M400 0 V800 M500 0 V800 M600 0 V800 M700 0 V800 M800 0 V800 M900 0 V800 M1000 0 V800 M1100 0 V800"/>
  </g>

  <!-- Neural network nodes (background) -->
  <g fill="#93c5fd" fill-opacity="0.7">
    <circle cx="120" cy="140" r="4"/>
    <circle cx="980" cy="120" r="3"/>
    <circle cx="1080" cy="280" r="5"/>
    <circle cx="160" cy="640" r="4"/>
    <circle cx="1040" cy="680" r="4"/>
    <circle cx="220" cy="380" r="3"/>
    <circle cx="60" cy="440" r="3"/>
    <circle cx="900" cy="540" r="4"/>
    <circle cx="540" cy="80" r="3"/>
    <circle cx="660" cy="740" r="3"/>
  </g>
  <g stroke="#93c5fd" stroke-opacity="0.18" stroke-width="1" fill="none">
    <path d="M120 140 L220 380 L60 440 L160 640"/>
    <path d="M980 120 L1080 280 L900 540 L1040 680"/>
    <path d="M540 80 L660 740"/>
  </g>

  <!-- DNA double helix (left side) -->
  <g transform="translate(180 130)">
    <g opacity="0.95">
      <path d="M0 0 C 120 80, 120 160, 0 240 C -120 320, -120 400, 0 480" fill="none" stroke="url(#strandA)" stroke-width="6" stroke-linecap="round"/>
      <path d="M0 0 C -120 80, -120 160, 0 240 C 120 320, 120 400, 0 480" fill="none" stroke="url(#strandB)" stroke-width="6" stroke-linecap="round"/>
      <!-- Rungs -->
      <g stroke="#e0e7ff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
        <line x1="-58" y1="40" x2="58" y2="40"/>
        <line x1="-80" y1="80" x2="80" y2="80"/>
        <line x1="-72" y1="120" x2="72" y2="120"/>
        <line x1="-40" y1="160" x2="40" y2="160"/>
        <line x1="-58" y1="280" x2="58" y2="280"/>
        <line x1="-80" y1="320" x2="80" y2="320"/>
        <line x1="-72" y1="360" x2="72" y2="360"/>
        <line x1="-40" y1="400" x2="40" y2="400"/>
      </g>
      <!-- Base pair atoms -->
      <g fill="#22d3ee">
        <circle cx="-58" cy="40" r="6"/>
        <circle cx="58" cy="40" r="6"/>
        <circle cx="-80" cy="80" r="6"/>
        <circle cx="80" cy="80" r="6"/>
        <circle cx="-72" cy="120" r="6"/>
        <circle cx="72" cy="120" r="6"/>
        <circle cx="-40" cy="160" r="6"/>
        <circle cx="40" cy="160" r="6"/>
      </g>
      <g fill="#c4b5fd">
        <circle cx="-58" cy="280" r="6"/>
        <circle cx="58" cy="280" r="6"/>
        <circle cx="-80" cy="320" r="6"/>
        <circle cx="80" cy="320" r="6"/>
        <circle cx="-72" cy="360" r="6"/>
        <circle cx="72" cy="360" r="6"/>
        <circle cx="-40" cy="400" r="6"/>
        <circle cx="40" cy="400" r="6"/>
      </g>
    </g>
  </g>

  <!-- Molecule structure (right side) -->
  <g transform="translate(820 220)" stroke="#bfdbfe" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hexagon ring (benzene) -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="rgba(96,165,250,0.12)" stroke="#bfdbfe"/>
    <!-- Inner double-bond -->
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="none" stroke="#bfdbfe" stroke-opacity="0.55"/>
    <!-- Bonds -->
    <line x1="78" y1="-45" x2="150" y2="-90"/>
    <line x1="78" y1="45" x2="150" y2="90"/>
    <line x1="-78" y1="-45" x2="-160" y2="-80"/>
    <line x1="-78" y1="45" x2="-150" y2="100"/>
    <line x1="0" y1="-90" x2="0" y2="-170"/>
    <line x1="0" y1="90" x2="0" y2="170"/>
  </g>
  <!-- Molecule atoms -->
  <g transform="translate(820 220)">
    <circle cx="0" cy="-90" r="10" fill="#fbbf24"/>
    <circle cx="78" cy="-45" r="10" fill="#e0e7ff"/>
    <circle cx="78" cy="45" r="10" fill="#e0e7ff"/>
    <circle cx="0" cy="90" r="10" fill="#fbbf24"/>
    <circle cx="-78" cy="45" r="10" fill="#e0e7ff"/>
    <circle cx="-78" cy="-45" r="10" fill="#e0e7ff"/>
    <circle cx="150" cy="-90" r="9" fill="#34d399"/>
    <circle cx="150" cy="90" r="9" fill="#34d399"/>
    <circle cx="-160" cy="-80" r="9" fill="#f472b6"/>
    <circle cx="-150" cy="100" r="9" fill="#f472b6"/>
    <circle cx="0" cy="-170" r="9" fill="#60a5fa"/>
    <circle cx="0" cy="170" r="9" fill="#60a5fa"/>
  </g>

  <!-- Central pill/capsule -->
  <g transform="translate(600 420) rotate(-22)">
    <rect x="-150" y="-44" width="300" height="88" rx="44" ry="44" fill="url(#pill)" filter="url(#soft)" opacity="0.45"/>
    <rect x="-150" y="-44" width="300" height="88" rx="44" ry="44" fill="url(#pill)"/>
    <line x1="0" y1="-44" x2="0" y2="44" stroke="#1e293b" stroke-opacity="0.35" stroke-width="2"/>
    <!-- Highlights -->
    <ellipse cx="-90" cy="-22" rx="40" ry="8" fill="#ffffff" fill-opacity="0.35"/>
    <ellipse cx="80" cy="20" rx="36" ry="6" fill="#ffffff" fill-opacity="0.15"/>
  </g>

  <!-- Neural network overlay near pill -->
  <g transform="translate(600 420)">
    <g fill="#ffffff" fill-opacity="0.85">
      <circle cx="-260" cy="-120" r="5"/>
      <circle cx="-220" cy="-30" r="4"/>
      <circle cx="-280" cy="60" r="5"/>
      <circle cx="260" cy="-130" r="5"/>
      <circle cx="240" cy="-20" r="4"/>
      <circle cx="290" cy="80" r="5"/>
      <circle cx="0" cy="-150" r="4"/>
      <circle cx="-30" cy="180" r="4"/>
      <circle cx="40" cy="190" r="4"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" fill="none">
      <path d="M-260 -120 L-150 -44 L-220 -30 L-150 0 L-280 60 L-150 30"/>
      <path d="M260 -130 L150 -44 L240 -20 L150 0 L290 80 L150 30"/>
      <path d="M0 -150 L-60 -44 M0 -150 L60 -44"/>
      <path d="M-30 180 L-40 44 M40 190 L40 44"/>
    </g>
  </g>

  <!-- AI label chip -->
  <g transform="translate(600 420)">
    <rect x="-44" y="-18" width="88" height="36" rx="18" fill="#0f172a" fill-opacity="0.55" stroke="#93c5fd" stroke-opacity="0.6"/>
    <text x="0" y="6" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-weight="700" font-size="20" fill="#e0e7ff" letter-spacing="2">AI</text>
  </g>

  <!-- Subtle scan-lines / depth -->
  <rect width="1200" height="800" fill="url(#glow)" opacity="0.4"/>
</svg>
