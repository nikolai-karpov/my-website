<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ИИ-управляемый фармацевтический склад с робототехникой">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f4d"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <!-- Floor with perspective -->
  <g stroke="#1e3a8a" stroke-opacity="0.4" stroke-width="1">
    <path d="M0 340 L1600 340"/>
    <path d="M0 360 L1600 360"/>
    <path d="M0 380 L1600 380"/>
    <path d="M0 400 L1600 400"/>
  </g>

  <!-- Warehouse racks (rear row, smaller) -->
  <g opacity="0.55">
    <g transform="translate(120 80)">
      <rect x="0" y="0" width="180" height="200" fill="url(#rack)" stroke="#475569"/>
      <line x1="0" y1="50" x2="180" y2="50" stroke="#475569"/>
      <line x1="0" y1="100" x2="180" y2="100" stroke="#475569"/>
      <line x1="0" y1="150" x2="180" y2="150" stroke="#475569"/>
      <rect x="10" y="10" width="34" height="34" fill="#3b82f6"/>
      <rect x="50" y="10" width="34" height="34" fill="#60a5fa"/>
      <rect x="90" y="10" width="34" height="34" fill="#22d3ee"/>
      <rect x="130" y="10" width="34" height="34" fill="#a78bfa"/>
      <rect x="10" y="60" width="34" height="34" fill="#60a5fa"/>
      <rect x="50" y="60" width="34" height="34" fill="#3b82f6"/>
      <rect x="130" y="60" width="34" height="34" fill="#22d3ee"/>
      <rect x="10" y="110" width="34" height="34" fill="#a78bfa"/>
      <rect x="90" y="110" width="34" height="34" fill="#3b82f6"/>
      <rect x="130" y="110" width="34" height="34" fill="#60a5fa"/>
    </g>
    <g transform="translate(400 80)">
      <rect x="0" y="0" width="180" height="200" fill="url(#rack)" stroke="#475569"/>
      <line x1="0" y1="50" x2="180" y2="50" stroke="#475569"/>
      <line x1="0" y1="100" x2="180" y2="100" stroke="#475569"/>
      <line x1="0" y1="150" x2="180" y2="150" stroke="#475569"/>
      <rect x="10" y="10" width="34" height="34" fill="#a78bfa"/>
      <rect x="90" y="10" width="34" height="34" fill="#60a5fa"/>
      <rect x="130" y="10" width="34" height="34" fill="#3b82f6"/>
      <rect x="10" y="60" width="34" height="34" fill="#22d3ee"/>
      <rect x="50" y="60" width="34" height="34" fill="#a78bfa"/>
      <rect x="90" y="60" width="34" height="34" fill="#60a5fa"/>
      <rect x="50" y="110" width="34" height="34" fill="#3b82f6"/>
      <rect x="90" y="110" width="34" height="34" fill="#22d3ee"/>
      <rect x="130" y="110" width="34" height="34" fill="#a78bfa"/>
    </g>
  </g>

  <!-- Warehouse racks (front row, larger) -->
  <g transform="translate(700 100)">
    <rect x="0" y="0" width="220" height="220" fill="url(#rack)" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="55" x2="220" y2="55" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="110" x2="220" y2="110" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="165" x2="220" y2="165" stroke="#64748b" stroke-width="2"/>
    <!-- Boxes with QR-like patterns -->
    <g>
      <rect x="12" y="12" width="40" height="40" fill="#3b82f6"/>
      <rect x="16" y="16" width="8" height="8" fill="#e0e7ff"/>
      <rect x="40" y="40" width="8" height="8" fill="#e0e7ff"/>
      <rect x="58" y="12" width="40" height="40" fill="#60a5fa"/>
      <rect x="62" y="16" width="6" height="6" fill="#e0e7ff"/>
      <rect x="86" y="40" width="6" height="6" fill="#e0e7ff"/>
      <rect x="104" y="12" width="40" height="40" fill="#22d3ee"/>
      <rect x="150" y="12" width="40" height="40" fill="#a78bfa"/>
      <rect x="196" y="12" width="12" height="40" fill="#475569"/>

      <rect x="12" y="65" width="40" height="40" fill="#a78bfa"/>
      <rect x="58" y="65" width="40" height="40" fill="#3b82f6"/>
      <rect x="62" y="69" width="6" height="6" fill="#e0e7ff"/>
      <rect x="86" y="93" width="6" height="6" fill="#e0e7ff"/>
      <rect x="104" y="65" width="40" height="40" fill="#60a5fa"/>
      <rect x="150" y="65" width="40" height="40" fill="#22d3ee"/>
      <rect x="196" y="65" width="12" height="40" fill="#475569"/>

      <rect x="58" y="120" width="40" height="40" fill="#22d3ee"/>
      <rect x="104" y="120" width="40" height="40" fill="#3b82f6"/>
      <rect x="108" y="124" width="6" height="6" fill="#e0e7ff"/>
      <rect x="132" y="148" width="6" height="6" fill="#e0e7ff"/>
      <rect x="150" y="120" width="40" height="40" fill="#a78bfa"/>
    </g>
    <!-- Status LEDs -->
    <circle cx="200" cy="32" r="4" fill="#22c55e"/>
    <circle cx="200" cy="85" r="4" fill="#22c55e"/>
    <circle cx="200" cy="140" r="4" fill="#facc15"/>
    <circle cx="200" cy="195" r="4" fill="#22c55e"/>
  </g>

  <g transform="translate(1000 100)">
    <rect x="0" y="0" width="220" height="220" fill="url(#rack)" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="55" x2="220" y2="55" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="110" x2="220" y2="110" stroke="#64748b" stroke-width="2"/>
    <line x1="0" y1="165" x2="220" y2="165" stroke="#64748b" stroke-width="2"/>
    <g>
      <rect x="12" y="12" width="40" height="40" fill="#60a5fa"/>
      <rect x="58" y="12" width="40" height="40" fill="#a78bfa"/>
      <rect x="104" y="12" width="40" height="40" fill="#3b82f6"/>
      <rect x="150" y="12" width="40" height="40" fill="#22d3ee"/>
      <rect x="12" y="65" width="40" height="40" fill="#22d3ee"/>
      <rect x="58" y="65" width="40" height="40" fill="#60a5fa"/>
      <rect x="104" y="65" width="40" height="40" fill="#a78bfa"/>
      <rect x="150" y="65" width="40" height="40" fill="#3b82f6"/>
      <rect x="12" y="120" width="40" height="40" fill="#3b82f6"/>
      <rect x="104" y="120" width="40" height="40" fill="#22d3ee"/>
      <rect x="150" y="120" width="40" height="40" fill="#60a5fa"/>
    </g>
  </g>

  <!-- AGV robot -->
  <g transform="translate(380 290)">
    <!-- Body -->
    <rect x="0" y="0" width="120" height="40" rx="6" fill="#22d3ee" stroke="#0e7490" stroke-width="2"/>
    <rect x="8" y="6" width="104" height="14" rx="3" fill="#0f172a"/>
    <rect x="14" y="10" width="28" height="6" fill="#22d3ee"/>
    <rect x="50" y="10" width="36" height="6" fill="#a78bfa"/>
    <rect x="94" y="10" width="14" height="6" fill="#22c55e"/>
    <!-- Pallet on top -->
    <rect x="20" y="-26" width="80" height="22" fill="#3b82f6"/>
    <rect x="24" y="-22" width="20" height="18" fill="#e0e7ff"/>
    <rect x="48" y="-22" width="20" height="18" fill="#e0e7ff"/>
    <rect x="72" y="-22" width="20" height="18" fill="#e0e7ff"/>
    <!-- Wheels -->
    <circle cx="24" cy="46" r="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <circle cx="96" cy="46" r="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- Sensor beam -->
    <path d="M120 16 L200 16" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="120" cy="16" r="3" fill="#22d3ee"/>
  </g>

  <!-- Robotic arm above front rack -->
  <g transform="translate(960 60)" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="0" y2="50"/>
    <line x1="0" y1="50" x2="80" y2="80"/>
    <line x1="80" y1="80" x2="40" y2="140"/>
    <g fill="#cbd5e1" stroke="none">
      <circle cx="0" cy="0" r="10"/>
      <circle cx="0" cy="50" r="8"/>
      <circle cx="80" cy="80" r="8"/>
    </g>
    <!-- Gripper -->
    <g transform="translate(40 140)" stroke="#cbd5e1" stroke-width="4" fill="none">
      <line x1="-12" y1="0" x2="-12" y2="14"/>
      <line x1="12" y1="0" x2="12" y2="14"/>
    </g>
    <rect x="20" y="148" width="40" height="18" fill="#60a5fa" stroke="none"/>
  </g>

  <!-- Route overlay -->
  <g stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="6,6" fill="none">
    <path d="M380 330 Q 250 380 200 280 Q 180 200 320 180"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="200" cy="280" r="4"/>
    <circle cx="320" cy="180" r="4"/>
  </g>

  <!-- Network nodes (top) -->
  <g fill="#93c5fd" fill-opacity="0.75">
    <circle cx="120" cy="40" r="4"/>
    <circle cx="320" cy="50" r="3"/>
    <circle cx="540" cy="40" r="4"/>
    <circle cx="780" cy="40" r="3"/>
    <circle cx="1080" cy="50" r="4"/>
    <circle cx="1320" cy="40" r="3"/>
    <circle cx="1520" cy="60" r="4"/>
  </g>
  <g stroke="#93c5fd" stroke-opacity="0.25" stroke-width="1" fill="none">
    <path d="M120 40 L320 50 L540 40 L780 40 L1080 50 L1320 40 L1520 60"/>
  </g>

  <!-- Inventory dashboard -->
  <g transform="translate(1290 90)">
    <rect x="0" y="0" width="270" height="230" rx="10" fill="#0f172a" fill-opacity="0.88" stroke="#334155"/>
    <text x="14" y="26" font-family="ui-monospace,monospace" font-size="10" fill="#22d3ee" font-weight="700">SMART INVENTORY · AI</text>
    <text x="14" y="58" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">EXPIRED STOCK</text>
    <text x="14" y="82" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="22" fill="#22c55e">−67%</text>
    <text x="14" y="112" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">FORECAST ACCURACY</text>
    <text x="14" y="136" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="22" fill="#60a5fa">94.2%</text>
    <text x="14" y="166" font-family="ui-sans-serif,system-ui" font-size="11" fill="#94a3b8">DELIVERY OTIF</text>
    <text x="14" y="190" font-family="ui-sans-serif,system-ui" font-weight="700" font-size="22" fill="#a78bfa">98.5%</text>
    <!-- mini chart -->
    <polyline points="14,215 50,210 90,202 130,196 170,200 210,190 250,182" stroke="#22d3ee" stroke-width="2" fill="none"/>
  </g>
</svg>
