<div class="main-header">
    <div class="container header-container">
        <a href="index.html" class="logo">Карпов Николай</a>

        <!-- Десктопное меню -->
        <nav class="desktop-nav">
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="methodology.html">Методология</a></li>
                <li><a href="cases.html">Кейсы</a></li>
                <li><a href="results.html">Результаты</a></li>
                <li>
                    <button class="theme-toggle" aria-label="Переключить тему">
                        <i class="fas fa-moon"></i>
                    </button>
                </li>
                <li><a href="contacts.html" class="cta-button primary">Контакты</a></li>
            </ul>
        </nav>

        <!-- Гамбургер-кнопка для мобильных -->
        <button class="hamburger" aria-label="Меню" aria-expanded="false">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <!-- Оверлей для мобильного меню -->
        <div class="mobile-overlay"></div>

        <!-- Мобильное меню -->
        <nav class="mobile-nav" aria-hidden="true">
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="methodology.html">Методология</a></li>
                <li><a href="cases.html">Кейсы</a></li>
                <li><a href="results.html">Результаты</a></li>
                <li>
                    <button class="theme-toggle" aria-label="Переключить тему">
                        <i class="fas fa-moon"></i>
                        <span>Переключить тему</span>
                    </button>
                </li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const hamburger = document.querySelector('.hamburger');
        const mobileNav = document.querySelector('.mobile-nav');
        const mobileOverlay = document.querySelector('.mobile-overlay');
        const mobileLinks = document.querySelectorAll('.mobile-nav a');

        function toggleMenu() {
            const isExpanded = hamburger.getAttribute('aria-expanded') === 'true';
            hamburger.setAttribute('aria-expanded', !isExpanded);
            mobileNav.setAttribute('aria-hidden', !isExpanded);
            mobileOverlay.classList.toggle('active');
            document.body.style.overflow = !isExpanded ? 'hidden' : '';
        }

        hamburger.addEventListener('click', toggleMenu);
        mobileOverlay.addEventListener('click', toggleMenu);
        mobileLinks.forEach(link => link.addEventListener('click', toggleMenu));
    });

    function setActivePage() {
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const links = document.querySelectorAll('.desktop-nav a, .mobile-nav a');

        links.forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPage) {
                link.classList.add('active');
            }
        });
    }

    // Вызвать после загрузки DOM
    document.addEventListener('DOMContentLoaded', setActivePage);

    // Переключатель темы
    const themeToggle = document.querySelector('.theme-toggle');
    
    if (themeToggle) {
      themeToggle.addEventListener('click', function() {
        document.body.classList.toggle('force-light-theme');
        
        // Обновить иконку
        const icon = this.querySelector('i');
        if (document.body.classList.contains('force-light-theme')) {
          icon.classList.remove('fa-moon');
          icon.classList.add('fa-sun');
          this.setAttribute('aria-label', 'Включить темную тему');
        } else {
          icon.classList.remove('fa-sun');
          icon.classList.add('fa-moon');
          this.setAttribute('aria-label', 'Включить светлую тему');
        }
      });
    }
</script>
