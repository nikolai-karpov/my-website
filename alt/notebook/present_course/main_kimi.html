<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Implementation Playbook – Николай Карпов</title>

    <!-- Критические стили (без файлов, чтобы не ждать) -->
    <style>
        :root {
            --color-primary-500: #4A90E2;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --color-background-light: #ffffff;
            --color-background-grey: #f8f9fa;
            --color-text-main: #34495e;
            --color-text-invert: #ffffff;
            --shadow-base: 0 10px 40px rgba(0,0,0,.08);
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 48px;
            --border-radius: 8px;
            --border-radius-lg: 16px;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --line-height: 1.6;
            --z-sticky: 1020;
            --z-modal: 1040;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-family);
            line-height: var(--line-height);
            color: var(--color-text-main);
            background: var(--color-background-grey);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Контейнер слайдов */
        #presentation-container {
            flex: 1;
            position: relative;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity .8s ease, visibility .8s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-lg);
        }
        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        /* Навигация */
        .progress-indicator {
            position: fixed;
            top: 50%;
            right: var(--spacing-md);
            transform: translateY(-50%);
            z-index: var(--z-sticky);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--color-text-main);
            opacity: .4;
            cursor: pointer;
            transition: opacity .3s, transform .3s;
        }
        .progress-dot.active {
            opacity: 1;
            background: var(--color-primary-500);
            transform: scale(1.3);
        }

        .nav-buttons {
            position: fixed;
            bottom: var(--spacing-lg);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: var(--spacing-sm);
            z-index: var(--z-sticky);
        }
        .nav-btn {
            background: var(--color-primary-500);
            color: var(--color-text-invert);
            border: none;
            padding: 10px 20px;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: background .3s, transform .3s;
        }
        .nav-btn:hover { background: #357ABD; }
        .nav-btn:disabled { background: #a0c4e4; cursor: not-allowed; }

        /* Адаптив */
        @media (max-width: 768px) {
            .slide { padding: var(--spacing-lg) var(--spacing-md); }
            .progress-indicator { right: var(--spacing-sm); }
        }
    </style>

    <!-- Подключаем ваши CSS-файлы (если лежат рядом) -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/presentation.css">
</head>

<body>
<!-- Индикатор прогресса -->
<nav class="progress-indicator" id="progress-indicator"></nav>

<!-- Кнопки навигации -->
<div class="nav-buttons">
    <button class="nav-btn nav-btn-prev" aria-label="Назад">← Назад</button>
    <button class="nav-btn nav-btn-next" aria-label="Вперёд">Вперёд →</button>
</div>

<!-- Контейнер для динамически подгружаемых слайдов -->
<main id="presentation-container"></main>

<!-- ==========  СКРИПТЫ  ========== -->
<script type="module">
    // Список файлов слайдов (порядок важен)
    const slideFiles = [
      'slides/01-title.html',
      'slides/02-problem.html',
      'slides/03-solution.html',
      'slides/04-case-1.html',
      'slides/05-case-2.html',
      'slides/06-tech-stack.html',
      'slides/07-results.html',
      'slides/08-final.html',
      'slides/09-meta.html'
    ];

    const container   = document.getElementById('presentation-container');
    const progress    = document.getElementById('progress-indicator');
    const btnPrev     = document.querySelector('.nav-btn-prev');
    const btnNext     = document.querySelector('.nav-btn-next');

    let slides        = [];
    let current       = 0;
    let isAnimating   = false;

    // 1. Загружаем все слайды
    async function loadSlides() {
      for (const file of slideFiles) {
        try {
          const res  = await fetch(file);
          const html = await res.text();
          const sec  = document.createElement('section');
          sec.className = 'slide';
          sec.id = file.replace('slides/','').replace('.html','');
          sec.innerHTML = html;
          container.appendChild(sec);
          slides.push(sec);
        } catch (e) {
          console.warn('Не загружен слайд:', file, e);
        }
      }
      initNavigation();
    }

    // 2. Навигация
    function initNavigation() {
      // Создаём точки прогресса
      slides.forEach((s, i) => {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        dot.setAttribute('aria-label', `Слайд ${i+1}`);
        dot.dataset.slide = i;
        dot.addEventListener('click', () => goToSlide(i));
        progress.appendChild(dot);
      });

      // Кнопки
      btnPrev.addEventListener('click', () => goToSlide(current - 1));
      btnNext.addEventListener('click', () => goToSlide(current + 1));

      // Клавиатура
      document.addEventListener('keydown', e => {
        if (isAnimating) return;
        if (e.key === 'ArrowRight' || e.key === ' ') goToSlide(current + 1);
        if (e.key === 'ArrowLeft')  goToSlide(current - 1);
        if (e.key === 'Home')       goToSlide(0);
        if (e.key === 'End')        goToSlide(slides.length - 1);
      });

      // Хэш
      window.addEventListener('hashchange', () => {
        const hash = location.hash.slice(1);
        const idx  = slides.findIndex(s => s.id === hash);
        if (idx !== -1) goToSlide(idx);
      });

      // Стартовый слайд
      const hashIndex = slides.findIndex(s => s.id === location.hash.slice(1));
      goToSlide(hashIndex >= 0 ? hashIndex : 0);
    }

    // 3. Переход к слайду
    async function goToSlide(index) {
      if (isAnimating || index < 0 || index >= slides.length) return;
      isAnimating = true;

      const prev = slides[current];
      const next = slides[index];

      // Анимация исчезания / появления
      prev.classList.remove('active');
      next.classList.add('active');

      await new Promise(r => setTimeout(r, 400)); // длительность transition

      current = index;
      updateUI();
      updateHash();
      isAnimating = false;

      // Событие для внешних скриптов (анимации, интерактив)
      next.dispatchEvent(new CustomEvent('slideEnter', {detail:{index, slide:next}}));
    }

    // 4. Обновление UI
    function updateUI() {
      document.querySelectorAll('.progress-dot').forEach((d,i) =>
        d.classList.toggle('active', i === current)
      );
      btnPrev.disabled = current === 0;
      btnNext.disabled = current === slides.length - 1;
    }
    function updateHash() {
      history.replaceState(null, null, '#' + slides[current].id);
    }

    // 5. Старт
    loadSlides();
</script>

<!-- Подключаем ваши JS-модули (если нужно) -->
<script src="assets/js/navigation.js" defer></script>
<script src="assets/js/interactions.js" defer></script>
<script src="assets/js/animations.js" defer></script>
</body>
</html>
