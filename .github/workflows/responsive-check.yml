name: Responsive overflow check

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/css/**"
      - "curs/**"
      - "scripts/check-overflow.mjs"
      - "scripts/check-overflow.allowlist.json"
      - ".github/workflows/responsive-check.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "assets/css/**"
      - "curs/**"
      - "scripts/check-overflow.mjs"
      - "scripts/check-overflow.allowlist.json"
      - ".github/workflows/responsive-check.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run check:responsive
