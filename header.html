    <div class="container header-container">
        <a href="index.html" class="logo">[Ваше Имя]</a>

        <!-- Десктопное меню -->
        <nav class="desktop-nav">
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="methodology.html">Методология</a></li>
                <li><a href="cases.html">Кейсы</a></li>
                <li><a href="results.html">Результаты</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>

        <!-- Гамбургер-кнопка для мобильных -->
        <button class="hamburger" aria-label="Меню" aria-expanded="false">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <!-- Мобильное меню -->
        <nav class="mobile-nav" aria-hidden="true">
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="methodology.html">Методология</a></li>
                <li><a href="cases.html">Кейсы</a></li>
                <li><a href="results.html">Результаты</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>

        <!-- Оверлей для мобильного меню -->
        <div class="mobile-overlay"></div>
    </div>
</div>

<style>
    .main-header {
        background-color: var(--white-color);
        padding: 15px 0;
        border-bottom: 1px solid var(--border-color);
        position: sticky;
        top: 0;
        z-index: 1000;
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
    }

    .header-container {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
    }

    .logo {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--dark-color);
        text-decoration: none;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        transition: var(--transition-smooth);
    }

    .logo:hover {
        text-decoration: none;
        transform: translateY(-1px);
    }

    /* Десктопное меню */
    .desktop-nav ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        gap: 35px;
    }

    .desktop-nav a {
        font-weight: 500;
        color: var(--dark-color);
        text-decoration: none;
        padding: 8px 0;
        position: relative;
        transition: var(--transition-smooth);
    }

    .desktop-nav a:hover {
        color: var(--primary-color);
        text-decoration: none;
    }

    .desktop-nav a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--gradient-primary);
        transition: width 0.3s ease;
    }

    .desktop-nav a:hover::after {
        width: 100%;
    }

    /* Гамбургер-кнопка */
    .hamburger {
        display: none;
        flex-direction: column;
        justify-content: space-between;
        width: 30px;
        height: 21px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        z-index: 1001;
    }

    .hamburger-line {
        width: 100%;
        height: 3px;
        background: var(--dark-color);
        border-radius: 2px;
        transition: all 0.3s ease;
        transform-origin: center;
    }

    /* Состояние активного гамбургера */
    .hamburger[aria-expanded="true"] .hamburger-line:nth-child(1) {
        transform: rotate(45deg) translate(6px, 6px);
    }

    .hamburger[aria-expanded="true"] .hamburger-line:nth-child(2) {
        opacity: 0;
    }

    .hamburger[aria-expanded="true"] .hamburger-line:nth-child(3) {
        transform: rotate(-45deg) translate(6px, -6px);
    }

    /* Мобильное меню */
    .mobile-nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 300px;
        height: 100vh;
        background: var(--white-color);
        box-shadow: -5px 0 30px rgba(0, 0, 0, 0.1);
        transition: right 0.3s ease;
        z-index: 1000;
        padding: 80px 30px 30px;
        overflow-y: auto;
    }

    .mobile-nav[aria-hidden="false"] {
        right: 0;
    }

    .mobile-nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .mobile-nav li {
        margin-bottom: 15px;
    }

    .mobile-nav a {
        display: block;
        padding: 15px 20px;
        color: var(--dark-color);
        text-decoration: none;
        font-weight: 500;
        border-radius: var(--border-radius);
        transition: var(--transition-smooth);
        border-left: 3px solid transparent;
    }

    .mobile-nav a:hover {
        background: var(--light-bg-color);
        color: var(--primary-color);
        text-decoration: none;
        border-left-color: var(--primary-color);
    }

    /* Оверлей для мобильного меню */
    .mobile-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: 999;
    }

    .mobile-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    /* Активное состояние пункта меню */
    .desktop-nav a.active,
    .mobile-nav a.active {
        color: var(--primary-color);
        font-weight: 600;
    }

    .desktop-nav a.active::after {
        width: 100%;
    }

    .mobile-nav a.active {
        background: var(--neural-glow);
        border-left-color: var(--primary-color);
    }

    /* Адаптивность */
    @media (max-width: 768px) {
        .desktop-nav {
            display: none;
        }

        .hamburger {
            display: flex;
        }

        .logo {
            font-size: 1.5rem;
        }
    }

    @media (max-width: 480px) {
        .mobile-nav {
            width: 100%;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const hamburger = document.querySelector('.hamburger');
        const mobileNav = document.querySelector('.mobile-nav');
        const mobileOverlay = document.querySelector('.mobile-overlay');
        const mobileLinks = document.querySelectorAll('.mobile-nav a');

        // Функция переключения меню
        function toggleMenu() {
            const isExpanded = hamburger.getAttribute('aria-expanded') === 'true';
            hamburger.setAttribute('aria-expanded', !isExpanded);
            mobileNav.setAttribute('aria-hidden', isExpanded);
            mobileOverlay.classList.toggle('active');
            document.body.style.overflow = !isExpanded ? 'hidden' : '';
        }

        // Обработчик клика по гамбургеру
        hamburger.addEventListener('click', toggleMenu);

        // Закрытие меню при клике на оверлей
        mobileOverlay.addEventListener('click', toggleMenu);

        // Закрытие меню при клике на ссылку
        mobileLinks.forEach(link => {
            link.addEventListener('click', toggleMenu);
        });

        // Закрытие меню при нажатии Escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && hamburger.getAttribute('aria-expanded') === 'true') {
                toggleMenu();
            }
        });

        // Определение активной страницы
        function setActivePage() {
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            const links = document.querySelectorAll('.desktop-nav a, .mobile-nav a');

            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPage) {
                    link.classList.add('active');
                }
            });
        }

        setActivePage();
    });
</script>
