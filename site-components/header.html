<div class="main-header">
    <div class="container header-container">
        <a href="/" class="logo">Карпов Николай</a>

        <!-- Десктопное меню -->
        <nav class="desktop-nav">
            <ul>
                <li><a href="/">Главная</a></li>
                <li><a href="/site-pages/methodology.html">Методология</a></li>
                <li><a href="/site-pages/case-studies/index.html">Кейсы</a></li>
                <li><a href="/site-pages/results.html">Результаты</a></li>
                <li><a href="/site-pages/contacts.html" class="cta-button primary">Контакты</a></li>
                <li><button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button></li>
            </ul>
        </nav>

        <!-- Гамбургер-кнопка для мобильных -->
        <button class="hamburger" aria-label="Меню" aria-expanded="false">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <!-- Оверлей для мобильного меню -->
        <div class="mobile-overlay"></div>

        <!-- Мобильное меню -->
        <nav class="mobile-nav" aria-hidden="true">
            <ul>
                <li><a href="/">Главная</a></li>
                <li><a href="/site-pages/methodology.html">Методология</a></li>
                <li><a href="/site-pages/case-studies/index.html">Кейсы</a></li>
                <li><a href="/site-pages/results.html">Результаты</a></li>
                <li><a href="/site-pages/contacts.html">Контакты</a></li>
                <li><button class="theme-toggle mobile-nav-item" id="theme-toggle-mobile" aria-label="Переключить тему">
                    <i class="fas fa-moon" id="theme-icon-mobile"></i>
                    <span>Переключить тему</span>
                </button></li>
            </ul>
        </nav>
    </div>
</div>

<style>
    /* СТИЛИ ДЛЯ РАБОЧЕГО ГАМБУРГЕРА */
    .hamburger {
        display: none;
        flex-direction: column;
        justify-content: space-between;
        width: 30px;
        height: 21px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        z-index: 1001;
    }

    .hamburger-line {
        width: 100%;
        height: 3px;
        background: var(--dark-color);
        border-radius: 2px;
        transition: all 0.3s ease;
        transform-origin: center;
    }

    .hamburger[aria-expanded="true"] .hamburger-line:nth-child(1) {
        transform: rotate(45deg) translate(6px, 6px);
    }

    .hamburger[aria-expanded="true"] .hamburger-line:nth-child(2) {
        opacity: 0;
    }

    .hamburger[aria-expanded="true"] .hamburger-line:nth-child(3) {
        transform: rotate(-45deg) translate(6px, -6px);
    }

    .mobile-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
        z-index: 998;
    }

    .mobile-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .mobile-nav {
        position: fixed;
        top: 0;
        right: -100%;
        width: 300px;
        height: 100vh;
        background: var(--white-color);
        box-shadow: -5px 0 30px rgba(0, 0, 0, 0.1);
        transition: right 0.3s ease;
        z-index: 999;
        padding: 80px 30px 30px;
        overflow-y: auto;
    }

    .mobile-nav[aria-hidden="false"] {
        right: 0;
    }

    /* Подсветка активного пункта меню */
    .desktop-nav a.active,
    .mobile-nav a.active {
        color: var(--primary-color);
        font-weight: 600;
    }

    @media (max-width: 768px) {
        .desktop-nav {
            display: none;
        }
        .hamburger {
            display: flex;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const hamburger = document.querySelector('.hamburger');
        const mobileNav = document.querySelector('.mobile-nav');
        const mobileOverlay = document.querySelector('.mobile-overlay');
        const mobileLinks = document.querySelectorAll('.mobile-nav a');

        function toggleMenu() {
            const isExpanded = hamburger.getAttribute('aria-expanded') === 'true';
            hamburger.setAttribute('aria-expanded', !isExpanded);
            mobileNav.setAttribute('aria-hidden', !isExpanded);
            mobileOverlay.classList.toggle('active');
            document.body.style.overflow = !isExpanded ? 'hidden' : '';
        }

        hamburger.addEventListener('click', toggleMenu);
        mobileOverlay.addEventListener('click', toggleMenu);
        mobileLinks.forEach(link => link.addEventListener('click', toggleMenu));
    });

    function setActivePage() {
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const links = document.querySelectorAll('.desktop-nav a, .mobile-nav a');

        links.forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPage) {
                link.classList.add('active');
            }
        });
    }

    // Вызвать после загрузки DOM
    document.addEventListener('DOMContentLoaded', setActivePage);

    // Переключатель темы
    document.addEventListener('DOMContentLoaded', function() {
        const themeToggle = document.getElementById('theme-toggle');
        const themeToggleMobile = document.getElementById('theme-toggle-mobile');
        const themeIcon = document.getElementById('theme-icon');
        const themeIconMobile = document.getElementById('theme-icon-mobile');

        // Проверяем сохраненную тему или системные настройки
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const currentTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');

        // Применяем тему
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            // Обновляем иконки
            const iconClass = theme === 'dark' ? 'fa-sun' : 'fa-moon';
            themeIcon.className = `fas ${iconClass}`;
            themeIconMobile.className = `fas ${iconClass}`;
        }

        // Устанавливаем начальную тему
        setTheme(currentTheme);

        // Обработчики кликов
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        }

        themeToggle.addEventListener('click', toggleTheme);
        themeToggleMobile.addEventListener('click', toggleTheme);

        // Следим за системными настройками
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });
    });
</script>
